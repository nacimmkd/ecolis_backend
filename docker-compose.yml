services:

  app:
    build: backend
    container_name: backend-app
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - FRONTEND_BASE_URL=http://localhost:80
    ports:
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: db-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: