spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: redis
      port: 6379

jwt:
  secret: ${JWT_SECRET}
  access-token-duration: 300
  refresh-token-duration: 604800
