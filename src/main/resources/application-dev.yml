spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET}
  access-token-duration: 1800
  refresh-token-duration: 604800

cors:
  allowed-origins:
    - ${front-end.base-url}
    - http://localhost:5173
    - http://localhost:3000
    - http://localhost:8080
    - http://localhost:80